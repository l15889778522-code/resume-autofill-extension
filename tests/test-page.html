<!doctype html>
<html lang="zh-CN">
<body>
  <form>
    <label for="name">姓名</label><input id="name">
    <label for="phone">联系电话</label><input id="phone" type="tel">
    <label for="email">电子邮箱</label><input id="email" type="email" value="existing@example.com">
    <label for="degree">最高学历</label>
    <select id="degree"><option value="">请选择</option><option value="bachelor">本科</option></select>
    <label for="fuzzy-city">期望城巿</label><input id="fuzzy-city">
    <label for="custom">站点专用问题</label><input id="custom">
    <label for="company-1">公司名称</label><input id="company-1">
    <label for="title-1">职位名称</label><input id="title-1">
    <label for="company-2">公司名称</label><input id="company-2">
    <label for="title-2">职位名称</label><input id="title-2">
    <section>
      <h2>求职偏好</h2>
      <label id="employment-label">雇佣类型</label>
      <button id="employment" type="button" role="combobox" aria-labelledby="employment-label" aria-controls="employment-options" aria-expanded="false">请选择</button>
      <div id="employment-options" role="listbox" hidden>
        <button type="button" role="option" data-value="full-time">全职</button>
        <button type="button" role="option" data-value="internship">实习</button>
      </div>
    </section>
  </form>
  <script>
    const employment = document.querySelector("#employment");
    const employmentOptions = document.querySelector("#employment-options");
    employment.addEventListener("click", () => {
      employmentOptions.hidden = false;
      employment.setAttribute("aria-expanded", "true");
    });
    employmentOptions.addEventListener("click", (event) => {
      const option = event.target.closest('[role="option"]');
      if (!option) return;
      employment.textContent = option.textContent;
      employment.setAttribute("aria-valuetext", option.textContent);
      employment.setAttribute("aria-expanded", "false");
      employmentOptions.hidden = true;
    });
  </script>
</body>
</html>
